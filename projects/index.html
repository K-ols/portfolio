
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects - Kristen Oleson</title>

    <link rel="stylesheet" href="../style.css">

    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>
</head>

<body>

    <h1 class="projects-title">Projects</h1>

    <!-- LAB 5: PIE CHART AND LEGEND -->
    <div class="container">

        <!-- Pie chart -->
        <svg
            id="projects-pie-plot"
            viewBox="-50 -50 100 100"
            aria-label="Pie chart of projects"
        ></svg>

        <!-- Pie chart legend -->
        <ul class="legend"></ul>

    </div>

   <!-- LAB 5: PROJECT SEARCH -->
<input
    class="searchBar"
    type="search"
    aria-label="Search projects"
    placeholder="🔍 Search projects..."
>

<!-- PROJECT CARDS -->
<div class="projects">
    <!-- Projects will be generated by JavaScript -->
</div>

</body>

</html>
