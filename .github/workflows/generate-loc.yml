
name: Generate Code Analysis CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate loc.csv
        run: |
          npm install --no-save elocuent
          npx elocuent -d . -o meta/loc.csv --spaces 2

      - name: Commit generated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/loc.csv
          if ! git diff --cached --quiet; then
            git commit -m "Generate code analysis CSV"
            git push
          fi
